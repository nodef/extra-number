name: CI
on:
  push:
    branches:
      - main
      - master
    tags:
      - '!*'  # Do not execute on tags
env:
  NAME:  ${{vars.NAME}}
  EMAIL: ${{vars.EMAIL}}
  NPM_TOKEN:    ${{secrets.NPM_TOKEN}}
  GITHUB_TOKEN: ${{secrets.GH_TOKEN}}
  FORCE_COLOR: 1
  NODE_VERSION: lts/*
  DENO_VERSION: v2.x
  PACKAGE_NAME: 'extra-number'


jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macOS-latest]
    name: Test on ${{matrix.platform}}
    runs-on: ${{matrix.platform}}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test


  publish-jsr:
    name: Publish to JSR
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: npx jsr publish

  publish-npm:
    name: Publish to NPM
    needs: [test, publish-jsr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{env.NODE_VERSION}}
          registry-url: 'https://registry.npmjs.org'
      - uses: nodef/jsr-mirror.action@v1.0.0
        with:
          registry: 'npm'
          registry-token: ${{env.NPM_TOKEN}}
          github-token: ${{env.GITHUB_TOKEN}}
          npmignore-path: .npmignore
          name: ${{env.PACKAGE_NAME}}
